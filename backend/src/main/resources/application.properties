spring.application.name=springboot-template-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/springboot_template}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

logging.level.org.springframework.security=INFO
