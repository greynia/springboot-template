spring.application.name=springboot-template-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/springboot_template}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

app.jwt.secret=${JWT_SECRET:0123456789abcdef0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.auth.refresh-token.expiration-days=${AUTH_REFRESH_TOKEN_EXPIRATION_DAYS:30}
app.auth.password-policy.min-length=${AUTH_PASSWORD_POLICY_MIN_LENGTH:8}
app.auth.password-policy.require-uppercase=${AUTH_PASSWORD_POLICY_REQUIRE_UPPERCASE:true}
app.auth.password-policy.require-lowercase=${AUTH_PASSWORD_POLICY_REQUIRE_LOWERCASE:true}
app.auth.password-policy.require-digit=${AUTH_PASSWORD_POLICY_REQUIRE_DIGIT:true}
app.auth.password-policy.require-special-character=${AUTH_PASSWORD_POLICY_REQUIRE_SPECIAL_CHARACTER:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PATCH,PUT,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.exposed-headers=${CORS_EXPOSED_HEADERS:Authorization}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}

logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{requestId:-no-request-id}] %logger{36} - %msg%n
