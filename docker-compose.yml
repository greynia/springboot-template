services:
  postgres:
    image: postgres:16-alpine
    container_name: springboot-template-postgres
    environment:
      POSTGRES_DB: springboot_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d springboot_template"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: springboot-template-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/springboot_template
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      JWT_EXPIRATION_MINUTES: 120
    ports:
      - "8080:8080"

volumes:
  postgres-data:
